name: CI

# Lint, typecheck and build every PR into main, and main itself after a merge.
# main deploys to production through Workers Builds, and that check is slow
# and posts no log to GitHub on failure, so this is the first place a broken
# change becomes visible with a readable error. See issue #40.
#
# There is no test step because there is no test runner yet (#22). The check
# is advisory until branch protection exists to make it required (#23).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the run already in flight for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Matches local development until #19 pins it in package.json.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        id: install
        run: npm ci

      # The three checks run independently once install succeeds, so a lint
      # failure does not hide a type or build error behind it.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      # PageProps and LayoutProps are globals that `next typegen` generates, so
      # tsc fails on a fresh checkout without it. It must also run before the
      # build: `vinext build` rewrites .next/types in a shape tsc rejects.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
