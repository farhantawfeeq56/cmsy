name: CI

# Lint, typecheck, test and build every PR into main, and main itself after a merge.
# main deploys to production through Workers Builds, and that check is slow
# and posts no log to GitHub on failure, so this is the first place a broken
# change becomes visible with a readable error. See issue #40.
#
# `check` is a required check on main (.github/rulesets/main-protection.json,
# #83), so a red run blocks the merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the run already in flight for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # .nvmrc is the one place the Node version is set; package.json's
      # devEngines makes npm ci fail on a Node or npm it does not accept.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        id: install
        run: npm ci

      # The checks run independently once install succeeds, so a lint
      # failure does not hide a type or build error behind it.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      # PageProps and LayoutProps are globals that `next typegen` generates, so
      # tsc fails on a fresh checkout without it. It must also run before the
      # build: `vinext build` rewrites .next/types in a shape tsc rejects.
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npx next typegen
          npx tsc --noEmit

      # Unit tests run in Node with the database stubbed, so they need no
      # DATABASE_URL and never touch the shared Neon project.
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
